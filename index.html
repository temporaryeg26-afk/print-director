<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>TEMPORARY™ Print Director</title><meta name="robots" content="noindex"></head><body>
<style>
/* TEMPORARY™ Print Director — dark technical studio */
:root{color-scheme:dark;
  --bg:#0B0B0B; --p1:#121212; --p2:#171717; --p3:#1D1D1D; --line:#242424; --line2:#2E2E2E;
  --tx:#EDEDED; --tx2:#C8C8C8; --mu:#9B9B9B;
  --warn:#E3A54A; --warnbg:#1A150D; --warnline:#3D2F17;
  --high:#E5735C; --highbg:#1E110E; --highline:#47231B;
  --ok:#86C2A0; --okbg:#0F1A14; --okline:#1F3A2B;
  --r:10px; --font:"Inter","Helvetica Neue",Arial,system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--tx)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:18px} h3{font-size:14px}
.mono{font-family:var(--mono)} .muted{color:var(--mu)} .small{font-size:12px} .tiny{font-size:11px}
.k{font-size:11px;letter-spacing:.14em;color:var(--mu);font-weight:600;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:8px} .grow{flex:1;min-width:0}
.sp{flex:1}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:0 20px;height:56px;background:rgba(11,11,11,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{font-weight:700;letter-spacing:.18em;font-size:13px;white-space:nowrap}
.brand span{color:var(--mu);font-weight:500;letter-spacing:.12em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;font-size:13px}
.tabs button:hover{color:var(--tx)}
.tabs button.on{background:var(--tx);color:var(--bg);font-weight:600}
.net{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.banner{padding:10px 20px;background:var(--warnbg);border-bottom:1px solid var(--warnline);color:var(--warn);font-size:13px}
.view{min-height:calc(100vh - 56px)}
.page{padding:24px 20px 60px;max-width:1500px;margin:0 auto}
.boot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:120px 20px;color:var(--mu)}
.spin{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--tx);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw}

.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--p2);border:1px solid var(--line2);border-radius:12px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-box p{margin:0;font-size:14px;line-height:1.5}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--tx);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#555}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.btn.pri:hover{background:#fff}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.fix{background:var(--warn);border-color:var(--warn);color:#111;font-weight:600}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn.lg{height:44px;padding:0 18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--tx2);cursor:pointer;font-size:12px;font-weight:500}
.chip:hover{border-color:#555;color:var(--tx)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg);font-weight:600}
.chip:disabled{opacity:.35;cursor:not-allowed}
input[type=number],input[type=text],input[type=date],select,textarea{background:var(--p2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;color:var(--tx);min-height:36px}
input[type=number]{width:84px}
textarea{width:100%;min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--tx);margin:0}
input[type=color]{width:36px;height:32px;border:1px solid var(--line2);background:var(--p2);border-radius:6px;padding:2px}
label{cursor:pointer}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.sw{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px #444;flex-shrink:0}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tx)}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:var(--r)}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--p3);color:var(--tx2)}
.st.ok{background:var(--okbg);color:var(--ok)} .st.warn{background:var(--warnbg);color:var(--warn)} .st.high{background:var(--highbg);color:var(--high)} .st.edit{background:#16182A;color:#AEB6F5}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:12px;padding:4px 9px;border-radius:6px;background:var(--p2);border:1px solid var(--line);color:var(--tx2)}
.facts span b{color:var(--tx);font-weight:600}
.facts span.w{border-color:var(--warnline);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--p2);border-radius:8px;padding:9px 10px;font-size:11px;color:var(--mu);letter-spacing:.06em}
.stat b{display:block;font:500 14px var(--mono);color:var(--tx);letter-spacing:0;margin-top:3px}
.stat b.w{color:var(--warn)} .stat b.h{color:var(--high)} .stat b.g{color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;color:var(--mu);font-weight:600;padding:8px;border-bottom:1px solid var(--line);text-transform:uppercase}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input[type=number]{width:72px;min-height:30px;padding:4px 6px}
.scrollx{overflow-x:auto}

/* director */
.dgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.dside{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
.dtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dtile{position:relative;aspect-ratio:1;border-radius:8px;border:1px solid var(--line2);background:#161616 center/contain no-repeat;cursor:pointer;padding:0;overflow:hidden}
.dtile.on{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx)}
.dtile span{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:4px 5px;background:rgba(0,0,0,.72);color:var(--tx2);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtile em{position:absolute;top:4px;right:4px;font-style:normal;font-size:9px;letter-spacing:.08em;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.7);color:var(--mu)}
.upl{display:flex;gap:8px}
.upl label{flex:1}
.verdict{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--p1);margin-bottom:14px;flex-wrap:wrap}
.verdict .big{font:600 26px var(--mono)}
.ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:16px}
.ctrl .grp{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pname h3{font-size:14px}
.pname p{margin:3px 0 0;font-size:12px;color:var(--mu)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.vcard{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.vcard.sel{border-color:var(--tx)}
.vcard .thumb{position:relative;aspect-ratio:4/4.3;background:#1A1A1A;cursor:zoom-in;border:0;padding:0;display:block;width:100%}
.vcard .thumb canvas{width:100%;height:100%;display:block}
.vcard .thumb .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vcard .meta{padding:9px 10px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.vcard .meta .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.vcard .meta .t i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px #555;flex-shrink:0}
.vcard .meta .tr{color:var(--tx2)}
.vcard .meta .sz{font-family:var(--mono);color:var(--mu);font-size:11px}
.vcard .acts{display:flex;gap:6px;padding:0 10px 10px}
.vcard .acts .btn{flex:1}
.brow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.bcol{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.bcol i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px #555}
.bslots{display:grid;gap:8px}
.bslot{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.bslot.star{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.bslot.na{opacity:.7}
.bsh{font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:7px 9px;border-bottom:1px solid var(--line);color:var(--tx2)}
.bslot .bimg{position:relative;aspect-ratio:4/4.3;background:#1A1A1A;border:0;padding:0;cursor:zoom-in;display:block;width:100%}
.bslot .bimg canvas{width:100%;height:100%;display:block}
.bslot .bimg .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mu)}
.bslot .badge{position:absolute;top:6px;left:6px;background:var(--ok);color:#0B0B0B;font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:999px}
.bslot .bm{padding:8px 9px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.bslot .bn{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;font-size:13px}
.bslot .acts{display:flex;gap:6px;padding:0 9px 9px;margin-top:auto}
.bslot .acts .btn{flex:1}
.bothers{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.bother{display:inline-flex;gap:5px;align-items:center;background:var(--p2);border:1px solid var(--line);border-radius:999px;padding:2px 3px 2px 8px;font-size:11px;cursor:pointer}
.baudit summary{cursor:pointer;color:var(--tx2);font-size:11px}
.baudit ul{margin:4px 0 0;padding-left:16px;font-size:11px;color:var(--tx2)}
.sev-high{color:var(--high)} .sev-mid{color:var(--warn)} .sev-ok{color:var(--ok)}
.howscore{margin:-4px 0 6px} .howscore summary{cursor:pointer;font-size:12px;color:var(--tx2)}
@media (max-width:900px){.brow{grid-template-columns:1fr}.bcol{flex-direction:row;align-items:center}.bslots{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 8px}

/* print lab */
.lab{display:grid;grid-template-columns:330px minmax(0,1fr) 370px;height:calc(100vh - 56px);min-height:640px}
.lab>aside,.lab>section{min-height:0}
.lp,.rp{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.lp{border-right:1px solid var(--line)} .rp{border-left:1px solid var(--line)}
.lc{display:flex;flex-direction:column;min-width:0}
.ctxbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.ctxbar b{font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.sl{display:flex;flex-direction:column;gap:5px}
.sl .lab1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.sl .lab1 input[type=number]{width:70px;min-height:26px;padding:2px 6px;font:12px var(--mono);text-align:right}
.sl .hint{font-size:11px;color:var(--mu)}
.tg{display:flex;align-items:flex-start;gap:10px;font-size:13px}
.tg input{margin-top:3px;accent-color:var(--tx);width:16px;height:16px}
.tg .hint{display:block;font-size:11px;color:var(--mu)}
.vtool{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vp{position:relative;flex:1;min-height:320px;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
.vp.drag{cursor:grabbing}
.vp canvas{position:absolute;inset:0;width:100%;height:100%}
.vp .busy{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:8px;font-size:12px;background:rgba(0,0,0,.75);padding:6px 10px;border-radius:6px;color:var(--tx2)}
.vp .busy .spin{width:14px;height:14px}
.vp .tag{position:absolute;top:10px;font-size:10px;letter-spacing:.14em;color:var(--tx2);background:rgba(0,0,0,.6);padding:3px 7px;border-radius:4px;pointer-events:none}
.vstat{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.dot-ok{color:var(--ok)} .dot-busy{color:var(--warn)}
.mock{position:relative;border-radius:var(--r);background:#161616;overflow:hidden}
.mock canvas{width:100%;display:block}
.badge{font-size:11px;color:var(--warn);border:1px solid var(--warnline);padding:3px 8px;border-radius:999px;white-space:nowrap}
.rec{border:1px solid var(--line2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.rec .nm{font-size:16px;font-weight:600}
.why{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.why div{font-size:12px;color:var(--tx2);line-height:1.45}
.why b{color:var(--tx);font-family:var(--mono);font-size:11px;margin-right:6px}
.w{border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--warnline);background:var(--warnbg)}
.w.high{border-color:var(--highline);background:var(--highbg)}
.w.info{border-color:var(--line2);background:var(--p2)}
.w .wt{font-size:13px;font-weight:600;color:var(--warn)}
.w.high .wt{color:var(--high)} .w.info .wt{color:var(--tx)}
.w .wb{font-size:12px;color:var(--tx2)}
.w .wr{font:10px var(--mono);color:var(--mu)}
.okbox{border:1px solid var(--okline);background:var(--okbg);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:13px}
.threads{display:flex;gap:6px;flex-wrap:wrap}
.threads span{display:inline-flex;align-items:center;gap:6px;font:11px var(--mono);padding:4px 8px;border-radius:6px;background:var(--p2)}
.threads i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px #555}

/* compare */
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cslot{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--p1)}
.cslot .vp{height:380px;flex:none}
.cslot .ch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cslot .cf{padding:8px 10px;font-size:12px;color:var(--mu);border-top:1px solid var(--line)}

/* guide */
.ask{display:flex;gap:8px}
.ask input{flex:1;min-height:46px;font-size:15px}
.topic{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--p1)}
.topic ol{margin:8px 0 10px;padding-left:20px;color:var(--tx2)}
.topic li{margin:3px 0}
.tabsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu)}
.form select,.form input{width:100%}

@media (max-width:1200px){
  .lab{grid-template-columns:300px minmax(0,1fr);height:auto}
  .lab .rp{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .lab .lc{height:calc(100vh - 56px);min-height:560px}
}
@media (max-width:900px){
  .top{gap:12px;padding:0 12px}
  .brand span,.net span{display:none}
  .page{padding:16px 12px 48px}
  .dgrid{grid-template-columns:1fr}
  .dside{position:static}
  .prow{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .lab{grid-template-columns:1fr}
  .lab .lp{border-right:0;border-bottom:1px solid var(--line);order:2}
  .lab .lc{order:1;height:auto;min-height:0}
  .lab .vp{flex:none;height:58vh;min-height:320px}
  .verdict .grow{flex-basis:100%;order:-1}
  .verdict .btn{flex:1}
  .lab .rp{order:3}
  .cmp{grid-template-columns:1fr}
}

</style>

/* TEMPORARY™ Print Director — utilities (no external dependencies) */
var PD = window.PD || (window.PD = {});

PD.util = (function () {
  'use strict';

  function $(sel, root) { return (root || document).querySelector(sel); }

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'html') el.innerHTML = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      });
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }

      for (var k = 0; k < (j.variants || []).length; k++) await ST.put('variants', j.variants[k]);
      for (var t = 0; t < (j.tests || []).length; t++) await ST.put('tests', j.tests[t]);
      try { if (j.thresholds) localStorage.setItem('pd_rules', JSON.stringify(j.thresholds)); if (j.catalog) localStorage.setItem('pd_catalog_overrides', JSON.stringify(j.catalog)); } catch (e) { }
      toast('Backup imported — reloading'); setTimeout(function () { location.reload(); }, 800);
    } catch (e) { toast('Import failed: ' + e.message, 5000); }
  }

  /* ================= GUIDE ================= */
  function viewGuide(root) {
    var page = h('div', { class: 'page' }); root.appendChild(page);
    page.appendChild(h('h1', null, 'Guide'));
    page.appendChild(h('p', { class: 'muted small' }, 'Tell it what you want to do. It matches your words to the built-in help (English or Arabic keywords). It is a guide, not an AI, and it works offline.'));
    var input = h('input', { type: 'text', placeholder: 'e.g. "make the dots smaller on the 20 cm version" or "download everything for the vendor"', 'aria-label': 'What do you want to do?' });
    var ans = h('div', { class: 'col', style: { marginTop: '12px' } });
    function run() {
      U.clear(ans);
      var res = G.ask(input.value);
      if (!input.value.trim()) return;
      if (!res.length) { ans.appendChild(h('div', { class: 'topic' }, h('b', null, 'No matching topic.'), h('p', { class: 'small muted' }, 'Try words like size, dots, logo, embroidery, download, approve, warning, color, blurry.'))); return; }
      res.forEach(function (t, i) { ans.appendChild(topicCard(t, i === 0)); });
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
    input.addEventListener('input', U.debounce(run, 250));
    page.appendChild(h('div', { class: 'ask' }, input, h('button', { class: 'btn pri lg', onclick: run }, 'Show me')));
    page.appendChild(ans);
    page.appendChild(h('h2', { class: 'section-title' }, 'What each tab does'));
    page.appendChild(h('div', { class: 'tabsgrid' }, G.TABS.map(function (t) { return h('div', { class: 'topic' }, h('h3', null, t.title), h('p', { class: 'small muted' }, t.text), t.tab !== 'guide' ? h('button', { class: 'btn sm', onclick: function () { go(t.tab); } }, 'Open ' + t.title) : null); })));
    page.appendChild(h('h2', { class: 'section-title' }, 'All how-tos'));
    page.appendChild(h('div', { class: 'tabsgrid' }, G.TOPICS.map(function (t) { return topicCard(t, false); })));
    page.appendChild(h('h2', { class: 'section-title' }, 'What the app will never pretend'));
    page.appendChild(h('div', { class: 'card small' }, h('ul', { style: { margin: 0, paddingLeft: '18px', color: 'var(--tx2)' } },
      h('li', null, 'Mockup previews are simulations on photos with estimated scale — not a calibrated print proof.'),
      h('li', null, 'Upscaling a small file cannot add detail. Dots are drawn crisp at 300 DPI, but fine details in the source stay as they are.'),
      h('li', null, 'Embroidery previews and PNGs are references. Stitch files (DST/PES) must be digitized by the vendor.'),
      h('li', null, 'Your original files are never modified; every treatment is a separate version.'),
      h('li', null, 'Nothing is approved automatically, and drafts are never exported without your confirmation.'))));
  }
  function topicCard(t, open) {
    return h('div', { class: 'topic' }, h('h3', null, t.title), h('ol', null, t.steps.map(function (s) { return h('li', null, s); })),
      t.go && t.go !== 'guide' ? h('button', { class: 'btn sm' + (open ? ' pri' : ''), onclick: function () { go(t.go); } }, 'Take me there') : null);
  }

  /* ================= boot ================= */
  async function boot() {
    U.$$('#tabs button').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.tab); }); });
    function net() { var n = $('#net'); n.querySelector('i').style.background = navigator.onLine ? 'var(--ok)' : 'var(--warn)'; n.querySelector('span').textContent = navigator.onLine ? 'All processing local' : 'Offline · all processing local'; }
    window.addEventListener('online', net); window.addEventListener('offline', net); net();
    await C.resolveAssetBase();
    S.assetsOk = !!C.BASE.mockups;
    if (!S.assetsOk) {
      var b = $('#banner'); b.hidden = false;
      b.textContent = 'Mockup and design folders were not found. Put the print-director folder inside the order repository (next to /mockups and /designs). You can still upload designs; garment previews need the mockups.';
    }
    C.SEED_DESIGNS.forEach(function (d) { S.designs.push(Object.assign({ source: 'repo' }, d)); });
    try {
      var stored = await ST.all('designs'); (stored || []).forEach(function (d) { S.designs.push(Object.assign({}, d)); });
      var vs = await ST.all('variants'); (vs || []).forEach(function (v) { S.variants[v.id] = v; });
      S.tests = (await ST.all('tests')) || [];
    } catch (e) { console.warn('storage', e); }
    if (!S.assetsOk) S.designs = S.designs.filter(function (d) { return d.source !== 'repo'; });
    if (!designById(S.designId)) { var first = S.designs.filter(function (d) { return d.type === 'design'; })[0]; S.designId = first ? first.id : null; }
    if (!designById(S.logoId)) { var fl = S.designs.filter(function (d) { return d.type === 'logo'; })[0]; S.logoId = fl ? fl.id : ''; }
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { });
    go('best');
  }
  window.addEventListener('error', function (e) { console.error(e.error || e.message); });
  PD.app = { S: S, go: go, getVariant: getVariant, variantFromId: variantFromId, renderPng: renderPng, designById: designById, loadDesign: loadDesign };
  boot();
})();

</script>
